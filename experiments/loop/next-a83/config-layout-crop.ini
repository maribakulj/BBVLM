[PAGE_PARSER]
run_layout_parser = yes
run_line_cropper = yes
run_ocr = no
run_decoder = no

[LAYOUT_PARSER_1]
method = LAYOUT_CNN
detect_lines = yes
detect_regions = yes
merge_lines = no
adjust_heights = no
model_path = ./ParseNet_296000.pt
max_megapixels = 5
use_cpu = yes
downsample = 5
detection_threshold = 0.2
line_end_weight = 1.0
vertical_line_connection_range = 3
smooth_line_predictions = no

[LAYOUT_PARSER_2]
method = REGION_SORTER_SMART

[LINE_CROPPER]
interp = 2
line_scale = 1.0
line_height = 40

[OCR]
ocr_json = ./ocr_engine.json
use_cpu = yes

